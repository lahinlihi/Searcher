{% extends "base.html" %}

{% block title %}관심공고 - HIGH-SEARCH{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; gap: 14px">
    <div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">관심공고</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: var(--hs-muted)">별표로 담아 둔 공고입니다. 담은 공고는 사례 점수가 배우는 재료가 됩니다.</p>
    </div>

    <div class="hs-tabs" role="tablist">
        <button type="button" id="tab-bookmarks" role="tab" aria-selected="true" onclick="switchTab('bookmarks')" class="hs-tab active">담은 공고<span id="bookmark-count">-</span></button>
        <button type="button" id="tab-dismissed" role="tab" aria-selected="false" onclick="switchTab('dismissed')" class="hs-tab">관심없음<span id="dismissed-count">-</span></button>
    </div>

    <div id="panel-bookmarks">
        <ul id="bookmarks-list" class="hs-list"><li class="hs-empty">불러오는 중…</li></ul>
    </div>

    <div id="panel-dismissed" class="hidden">
        <p style="font-size: 13px; color: var(--hs-muted); margin: 0 0 4px">관심없음으로 숨긴 공고입니다. 복원하면 다시 대시보드에 나옵니다.</p>
        <ul id="dismissed-list" class="hs-list"><li class="hs-empty">불러오는 중…</li></ul>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/tender-row.js') }}"></script>
<script src="{{ url_for('static', filename='js/bookmarks.js') }}"></script>
{% endblock %}
