{% extends "base.html" %}

{% block title %}대시보드 - HIGH-SEARCH{% endblock %}

{% block content %}
<div class="hs-dash">

    <aside class="hs-dash-side" aria-label="요약과 필터">
        <div class="hs-kpis">
            <button type="button" class="hs-kpi hs-kpi-btn" onclick="gotoSearch('new')" title="신규공고 목록 보기">
                <div class="hs-kpi-label">신규 공고</div>
                <div class="hs-kpi-value" id="new-today">-</div>
            </button>
            <div class="hs-kpi" title="최근 7일 동안 관심 키워드에 걸린 공고">
                <div class="hs-kpi-label">키워드 매칭</div>
                <div class="hs-kpi-value" id="keyword-match" style="color: var(--hs-brand)">-</div>
            </div>
            <button type="button" class="hs-kpi hs-kpi-btn" onclick="gotoSearch('pre')" title="사전규격 목록 보기">
                <div class="hs-kpi-label">사전규격</div>
                <div class="hs-kpi-value" id="pre-announcement">-</div>
            </button>
            <button type="button" class="hs-kpi hs-kpi-btn" onclick="gotoSearch('deadline')" title="마감임박 목록 보기 (3일 이내)">
                <div class="hs-kpi-label">마감 임박</div>
                <div class="hs-kpi-value" id="deadline-soon">-</div>
            </button>
        </div>

        <details id="side-more" class="hs-side-more" open>
        <summary class="hs-side-more-btn">관심 키워드 · 필터</summary>
        <div>
            <div class="hs-side-title">관심 키워드 <a href="/filters" class="hs-link">수정</a></div>
            <div id="active-keywords" style="display: flex; flex-wrap: wrap; gap: 6px"></div>
        </div>

        <div>
            <div class="hs-side-title">필터</div>
            <label class="hs-check"><input type="checkbox" id="f-week" onchange="resetPageAndRender()"> 7일 안에 마감</label>
            <label class="hs-check"><input type="checkbox" id="f-big" onchange="resetPageAndRender()"> 1억 이상</label>
            <label class="hs-check"><input type="checkbox" id="f-noprice" onchange="resetPageAndRender()"> 금액 미정 빼기</label>
        </div>
        </details>

        <button type="button" class="hs-link" onclick="gotoSearch('all')" style="border: 0; background: none; padding: 0; text-align: left; font-size: 13px; cursor: pointer">전체 공고 <span id="total-tenders">-</span>건 보기 →</button>
    </aside>

    <section class="hs-dash-main" aria-label="공고 목록">
        <div class="hs-tabs" role="tablist" id="dash-tabs">
            <button type="button" class="hs-tab active" role="tab" aria-selected="true" data-tab="all" onclick="setTab('all')">전체<span id="cnt-all"></span></button>
            <button type="button" class="hs-tab" role="tab" aria-selected="false" data-tab="pre" onclick="setTab('pre')">사전규격<span id="cnt-pre"></span></button>
            <button type="button" class="hs-tab" role="tab" aria-selected="false" data-tab="urgent" onclick="setTab('urgent')">나라장터 입찰<span id="cnt-urgent"></span></button>
            <button type="button" class="hs-tab" role="tab" aria-selected="false" data-tab="recent" onclick="setTab('recent')">기타 채널<span id="cnt-recent"></span></button>
            <button type="button" class="hs-tab" role="tab" aria-selected="false" data-tab="key" onclick="setTab('key')" title="가점을 준 발주처의 새 공고 — 적합도와 상관없이 모입니다">중점 발주처<span id="cnt-key"></span></button>
            <button type="button" class="hs-tab" role="tab" aria-selected="false" data-tab="similar" onclick="setTab('similar')">비슷한 공고<span id="cnt-similar"></span></button>
            <button type="button" class="hs-tab hs-tab-aside" role="tab" aria-selected="false" data-tab="recent_viewed" onclick="setTab('recent_viewed')">읽은 공고<span id="cnt-recent_viewed"></span></button>
        </div>

        <div id="hs-read-shelf" class="hs-read-shelf" aria-label="읽은 공고" hidden></div>

        <div id="hs-today" class="hs-today" hidden></div>

        <div class="hs-toolbar">
            <span id="list-caption">불러오는 중…</span>
            <label for="dash-sort" class="hs-sr">정렬</label>
            <select id="dash-sort" onchange="resetPageAndRender()">
                <option value="rec">적합도순</option>
                <option value="new">신규 먼저</option>
                <option value="days">마감 임박순</option>
                <option value="price">금액 큰 순</option>
            </select>
        </div>

        <ul id="hs-list" class="hs-list"></ul>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 휴대폰·좁은 화면에서는 키워드·필터를 접어 목록이 먼저 보이게 한다
if (window.matchMedia('(max-width: 860px)').matches) document.getElementById('side-more').open = false;
function gotoSearch(filter) {
    window.open('/search?filter=' + filter, '_blank');
}
</script>
<script src="{{ url_for('static', filename='js/tender-row.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
