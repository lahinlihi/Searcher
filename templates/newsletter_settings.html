{% extends "base.html" %}

{% block title %}발송 설정 - HIGH-SEARCH{% endblock %}

{% block content %}
<div class="space-y-4">

    <!-- 발송 계정 -->
    <div class="card">
        <div class="card-body space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-gray-800">발송 계정</span>
                <span id="conn-state" class="text-xs"></span>
            </div>

            <div class="grid sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">메일 서비스</label>
                    <select id="service" class="form-input text-sm w-full">
                        <option value="gmail">Gmail</option>
                        <option value="naver">네이버</option>
                        <option value="daum">다음/카카오</option>
                        <option value="outlook">Outlook</option>
                    </select>
                    <p id="service-hint" class="text-xs text-gray-500 mt-1"></p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">발신 계정</label>
                    <input type="email" id="user" class="form-input text-sm w-full"
                           placeholder="sender@example.com" autocomplete="off">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">
                    비밀번호 <span id="pw-state" class="font-normal text-gray-400"></span>
                </label>
                <input type="password" id="password" class="form-input text-sm w-full"
                       placeholder="변경할 때만 입력 (비워두면 기존 값 유지)"
                       autocomplete="new-password">
                <p class="text-xs text-gray-500 mt-1">
                    저장된 비밀번호는 화면으로 다시 보내지 않습니다. 변경할 때만 입력하세요.
                </p>
            </div>

            <div class="grid sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">발신자 표시 이름</label>
                    <input type="text" id="from-name" class="form-input text-sm w-full"
                           placeholder="오늘의 브리핑">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">
                        서비스 주소 <span class="font-normal text-gray-400">수신거부 링크에 사용</span></label>
                    <input type="text" id="base-url" class="form-input text-sm w-full"
                           placeholder="https://ht-search.com">
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-1">
                <button type="button" onclick="testConn()" id="btn-test"
                        class="btn-secondary text-sm">연결 테스트</button>
                <button type="button" onclick="saveSettings()" id="btn-save"
                        class="text-sm px-4 py-2 rounded font-semibold bg-green-600 text-white hover:bg-green-700">저장</button>
                <span class="text-xs text-gray-500">
                    연결 테스트는 로그인만 시도하고 메일을 보내지 않습니다.
                </span>
            </div>
        </div>
    </div>

    <!-- 구독자 -->
    <div class="card">
        <div class="card-body space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-gray-800">구독자</span>
                <span id="sub-count" class="text-xs text-gray-500"></span>
            </div>

            <div class="grid sm:grid-cols-4 gap-2">
                <input type="email" id="sub-email" class="form-input text-sm"
                       placeholder="이메일">
                <input type="text" id="sub-name" class="form-input text-sm"
                       placeholder="이름">
                <input type="text" id="sub-company" class="form-input text-sm"
                       placeholder="회사">
                <button type="button" onclick="addSub()"
                        class="btn-secondary text-sm whitespace-nowrap">추가</button>
            </div>
            <p class="text-xs text-gray-500">
                등록 시 수신동의 일시·경로·IP가 함께 기록됩니다. 분쟁 시 근거가 되는 항목입니다.
            </p>

            <div id="sub-list" class="text-sm"></div>
        </div>
    </div>
</div>

<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 z-50
     bg-gray-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg max-w-[90vw]"></div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/newsletter_settings.js') }}"></script>
{% endblock %}
